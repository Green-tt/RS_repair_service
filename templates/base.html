<!DOCTYPE html>
<html>
<head>
    <title>Service Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Modern CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #553c9a;
            font-size: 32px;
        }

        h2 {
            color: #553c9a;
            margin-bottom: 25px;
            font-size: 28px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Login Page */
        .login-form {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .login-form h2 {
            margin-top: 0;
            border-bottom: none;
            color: #553c9a;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin: 20px 0;
            transition: all 0.3s ease;
            background: white;
            cursor: pointer;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        /* Buttons */
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Forms */
        form {
            margin: 20px 0;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Links */
        a {
            display: inline-block;
            background: linear-gradient(135deg, #48c6ef 0%, #6f86d6 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            margin: 10px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(72,198,239,0.4);
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(72,198,239,0.6);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        table thead tr {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        table th, table td {
            padding: 15px 20px;
            text-align: left;
        }

        table tbody tr {
            border-bottom: 1px solid #dddddd;
            transition: all 0.3s ease;
        }

        table tbody tr:nth-of-type(even) {
            background-color: #f8f9ff;
        }

        table tbody tr:last-of-type {
            border-bottom: 2px solid #667eea;
        }

        table tbody tr:hover {
            background: #f0f3ff;
            transform: scale(1.01);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Status badges */
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-new { background: #ffd93d; color: #856404; }
        .status-assigned { background: #17a2b8; color: white; }
        .status-in_progress { background: #007bff; color: white; }
        .status-done { background: #28a745; color: white; }
        .status-canceled { background: #dc3545; color: white; }

        /* Inline forms in tables */
        table td form {
            display: inline-block;
            margin: 5px;
        }

        table td button {
            padding: 8px 16px;
            font-size: 14px;
        }

        /* Grid system for master selection */
        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .action-group select {
            width: auto;
            min-width: 120px;
            margin: 0;
        }

        /* Alert messages */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            .action-group {
                flex-direction: column;
                align-items: stretch;
            }

            .action-group select {
                width: 100%;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }

            table td form {
                display: block;
                width: 100%;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.5s ease-out;
        }

        /* Dashboard header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .user-info {
            background: #f0f3ff;
            padding: 10px 20px;
            border-radius: 10px;
            color: #553c9a;
            font-weight: 600;
        }

        .logout-btn {
            background: #dc3545;
            padding: 10px 20px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Service Desk</h1>
            <div>
                {% if g.user %}
                    <span class="user-info">{{ g.user.name }} ({{ g.user.role }})</span>
                    <a href="/login" class="logout-btn">Выйти</a>
                {% else %}
                    <span class="user-info">Гость</span>
                {% endif %}
            </div>
        </div>

        {% block content %}
        <!-- Здесь будет контент страниц -->
        {% endblock %}
    </div>
</body>
</html>
